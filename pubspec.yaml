name: denpa_memo
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.1

workspace:
  - modules/DataPack
  - modules/StepDialog
  - modules/GraphQLClient
  - modules/Graph
  - modules/Widgets
  - apps/WidgetBook

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^17.4.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  flutter_riverpod: ^3.4.2
  slang_flutter: ^4.19.0
  smooth_page_indicator: ^2.0.1
  objectbox: ^5.3.2
  objectbox_flutter_libs: ^5.3.2
  path_provider: ^2.1.6
  path: ^1.9.1
  qr_flutter: ^4.1.0
  cuid2: ^4.1.0
  crypto: ^3.0.7
  graphview: ^1.5.1
  file_picker: ^11.0.3
  croppy: ^1.4.1
  zxing2: ^0.2.4
  image: ^4.8.0
  collection: ^1.19.1
  archive: ^4.1.0
  package_info_plus: ^9.0.1
  graphql_flutter: ^5.2.1
  widgetbook: ^3.25.0
  widgetbook_annotation: ^3.11.0
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  go_router_builder: ^4.4.0
  build_runner: ^2.15.1
  freezed: ^3.2.5
  json_serializable: ^6.14.1
  slang: ^4.19.0
  objectbox_generator: ^5.3.2
  qr: ^3.0.2
  path_provider_platform_interface: ^2.1.3
  widgetbook_generator: ^3.24.0
  melos: ^8.5.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/icons/monster/
    - assets/routes/

melos:
  scripts:
    analyze:
      exec:
        command: flutter analyze .
        concurrency: 1
      packageFilters:
        flutter: true
      description: Run static analysis for every Flutter workspace package (data_pack is pure Dart and is analyzed separately with "dart analyze").
    test:
      exec:
        command: flutter test
        concurrency: 1
      packageFilters:
        flutter: true
      description: Run the test suite for every Flutter workspace package (data_pack is pure Dart and is tested separately with "dart test").
