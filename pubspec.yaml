name: denpa_memo
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.1

workspace:
  - modules/DataPack
  - modules/DataCache
  - modules/StepDialog
  - modules/GraphQLClient
  - modules/Graph
  - modules/Widgets
  - modules/FirebaseSignIn
  - modules/PlatformUtils
  - modules/DMFile
  - modules/AppDatas
  - modules/AppMetaData
  - modules/Toaster
  - modules/TableEditor
  - modules/APIClient
  - modules/denpamemo_logics
  - modules/Logging
  - apps/WidgetBook

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^17.4.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  flutter_riverpod: ">=3.3.0 <3.4.0"
  slang_flutter: ^4.19.0
  smooth_page_indicator: ^2.0.1
  objectbox: ^5.3.2
  objectbox_flutter_libs: ^5.3.2
  path_provider: ^2.1.6
  path: ^1.9.1
  qr_flutter: ^4.1.0
  cuid2: ^4.1.0
  crypto: ^3.0.7
  graphview: ^1.5.1
  file_picker: ^11.0.3
  croppy: ^1.4.1
  zxing2: ^0.2.4
  image: ^4.8.0
  collection: ^1.19.1
  archive: ^4.1.0
  package_info_plus: ^9.0.1
  graphql_flutter: ^5.2.1
  data_pack:
    path: modules/DataPack
  step_dialog:
    path: modules/StepDialog
  graphql_client:
    path: modules/GraphQLClient
  denpamemo_widgets:
    path: modules/Widgets
  firebase_sign_in:
    path: modules/FirebaseSignIn
  tree_graph:
    path: modules/Graph
  dm_file:
    path: modules/DMFile
  app_datas:
    path: modules/AppDatas
  app_metadata:
    path: modules/AppMetaData
  app_launcher_icon_widget: ^1.1.0
  data_cache:
    path: modules/DataCache
  toaster:
    path: modules/Toaster
  table_editor:
    path: modules/TableEditor
  api_client:
    path: modules/APIClient
  denpamemo_logics:
    path: modules/denpamemo_logics
  app_logging:
    path: modules/Logging
  icons_launcher: ^3.1.0
  http: ^1.6.0
  flutter_date_formatter: ^0.0.9
  intl: ^0.20.2
  logger: ^2.5.0
  flutter_build_tracker: ^1.0.0
  flutter_cache_manager: ^3.4.1
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_rust_bridge: 2.13.0
  flutter_lints: ^6.0.0
  go_router_builder: ^4.4.0
  build_runner: ">=2.15.1 <2.16.0"
  freezed: ^3.2.5
  json_serializable: ^6.14.1
  slang: ^4.19.0
  objectbox_generator: ^5.3.2
  qr: ^3.0.2
  path_provider_platform_interface: ^2.1.3
  melos: ^8.5.0
  pub_version_plus: ^3.1.3
  tidy_imports: ^1.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/icons/monster/
    - assets/routes/
    - assets/config/auth/google/
    - assets/icons/

icons_launcher:
  image_path: "assets/icons/app_icon.png"
  platforms:
    android:
      enable: true
    linux:
      enable: true
    

melos:
  scripts:
    analyze:
      exec:
        command: flutter analyze .
        concurrency: 1
      packageFilters:
        flutter: true
      description: Run static analysis for every Flutter workspace package (data_pack is pure Dart and is analyzed separately with "dart analyze").
    test:
      exec:
        command: flutter test
        concurrency: 1
      packageFilters:
        flutter: true
        dirExists:
          - test
      description: Run the test suite for every Flutter workspace package that has a test/ directory (data_pack is pure Dart and is tested separately with "dart test").
    slang:
      exec:
        command: dart run slang
        concurrency: 1
      packageFilters:
        fileExists:
          - slang.yaml
      description: Regenerate slang translations for every workspace package that has its own slang.yaml (currently modules/StepDialog and modules/Widgets). The root app's own slang.yaml is outside the workspace member list, so regenerate it separately with "dart run slang" at the repo root.
    app:run:
      run: dart pub run pub_version_plus:main build && flutter run
      description: Increment the pubspec.yaml build number, then run the root app with "flutter run".
    app:build:
      run: dart pub run pub_version_plus:main build && flutter build
      description: Increment the pubspec.yaml build number, then build the root app with "flutter build".

app_metadata:
  author: 'Hashibutogarasu'
  license: 'MIT'
dependency_overrides:
  test_api: 0.7.9
