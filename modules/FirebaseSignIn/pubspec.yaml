name: firebase_sign_in
description: Firebase sign-in/account abstraction with a REST (Identity Toolkit) fallback for platforms without native Firebase.
version: 0.1.0
publish_to: 'none'
resolution: workspace

environment:
  sdk: ^3.10.1

dependencies:
  firebase_auth: ^6.6.1
  firebase_core: ^4.14.0
  flutter:
    sdk: flutter
  flutter_riverpod: ">=3.3.0 <3.4.0"
  flutter_secure_storage: ^10.3.1
  google_sign_in: ^7.2.0
  http: ^1.6.0
  json_annotation: ^4.12.0
  platform_utils:
    path: ../PlatformUtils
  step_dialog:
    path: ../StepDialog
  url_launcher: ^6.3.2

dev_dependencies:
  build_runner: ">=2.15.1 <2.16.0"
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  json_serializable: ^6.14.1

flutter:
