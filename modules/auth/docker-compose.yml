services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: denpa_memo
      MINIO_ROOT_PASSWORD: denpa_memo_dev
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 10

  # The official minio image, unlike bitnami/minio, has no
  # MINIO_DEFAULT_BUCKETS equivalent, so this one-shot service creates the
  # bucket itself once minio is healthy, then exits. The bucket name must
  # match BUCKET_NAME in src/r2-credentials.ts.
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 denpa_memo denpa_memo_dev &&
      mc mb --ignore-existing local/denpa-memo-storage
      "

volumes:
  minio-data:
