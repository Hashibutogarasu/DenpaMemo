name: flatpak-build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: flatpak-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flatpak:
    name: Flatpak
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Decode Google OAuth client secrets
        env:
          GOOGLE_CLIENT_SECRETS_JSON_BASE64: ${{ secrets.GOOGLE_CLIENT_SECRETS_JSON_BASE64 }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/assets/config/auth/google"
          echo "$GOOGLE_CLIENT_SECRETS_JSON_BASE64" | base64 -d > "$GITHUB_WORKSPACE/assets/config/auth/google/google_client_secrets.json"

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: com.karasu256.denpamemo.flatpak
          manifest-path: flatpak/com.karasu256.denpamemo.yml
          cache-key: flatpak-builder-${{ hashFiles('flatpak/com.karasu256.denpamemo.yml') }}
