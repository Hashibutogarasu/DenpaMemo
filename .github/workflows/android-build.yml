name: android-build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_KEYSTORE_JKS_BASE64: ${{ secrets.ANDROID_KEYSTORE_JKS_BASE64 }}
  ANDROID_KEYSTORE_PEM_BASE64: ${{ secrets.ANDROID_KEYSTORE_PEM_BASE64 }}
  ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
  ANDROID_DEBUG_KEYSTORE_JKS_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_JKS_BASE64 }}
  ANDROID_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEYSTORE_PASSWORD }}
  GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
  GOOGLE_SERVICES_DEBUG_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_DEBUG_JSON_BASE64 }}
  GOOGLE_CLIENT_SECRETS_JSON_BASE64: ${{ secrets.GOOGLE_CLIENT_SECRETS_JSON_BASE64 }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/android-setup

  build-debug-apk:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/android-setup
        with:
          build-type: debug

      - name: Build debug APK
        env:
          RELEASE_CHANNEL: debug
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  build-release-apk:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/android-setup

      - name: Build release APK
        env:
          RELEASE_CHANNEL: release
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  build-release-aab:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/android-setup

      - name: Build release AAB
        env:
          RELEASE_CHANNEL: release
        run: flutter build appbundle --release --build-number=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: app-release.aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  build-playstore-internal-aab:
    if: github.event_name == 'workflow_dispatch'
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/android-setup

      - name: Build playstore-internal AAB
        env:
          RELEASE_CHANNEL: playstore-internal
        run: flutter build appbundle --release --build-number=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: app-playstore-internal.aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  build-playstore-beta-aab:
    if: github.event_name == 'workflow_dispatch'
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/android-setup

      - name: Build playstore-beta AAB
        env:
          RELEASE_CHANNEL: playstore-beta
        run: flutter build appbundle --release --build-number=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: app-playstore-beta.aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  publish-playstore-internal:
    if: github.event_name == 'workflow_dispatch'
    needs: build-playstore-internal-aab
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: app-playstore-internal.aab
          path: artifacts

      - name: Prepare release notes
        run: |
          mkdir -p whatsnew
          sed '/<!--/,/-->/d' RELEASE-DETAILS.md > whatsnew/whatsnew-ja-JP

      - uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.karasu256.denpamemo
          releaseFiles: artifacts/app-release.aab
          track: internal
          whatsNewDirectory: whatsnew/
          status: completed

  publish-playstore-beta:
    if: github.event_name == 'workflow_dispatch'
    needs: build-playstore-beta-aab
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: app-playstore-beta.aab
          path: artifacts

      - name: Prepare release notes
        run: |
          mkdir -p whatsnew
          sed '/<!--/,/-->/d' RELEASE-DETAILS.md > whatsnew/whatsnew-ja-JP

      - uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.karasu256.denpamemo
          releaseFiles: artifacts/app-release.aab
          track: beta
          whatsNewDirectory: whatsnew/
          status: completed

  build-playstore-aab:
    if: github.event_name == 'workflow_dispatch'
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/android-setup

      - name: Build playstore AAB
        env:
          RELEASE_CHANNEL: playstore
        run: flutter build appbundle --release --build-number=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: app-playstore.aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  cleanup:
    if: always()
    needs:
      - build-debug-apk
      - build-release-apk
      - build-release-aab
    runs-on: ubuntu-latest
    steps:
      - name: Report build results
        run: |
          echo "debug apk: ${{ needs.build-debug-apk.result }}"
          echo "release apk: ${{ needs.build-release-apk.result }}"
          echo "release aab: ${{ needs.build-release-aab.result }}"
